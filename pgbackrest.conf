[global]
repo1-path=/var/lib/pgbackrest
# 8 daily fulls: the oldest is always >= 7 days old, so any second of the
# last week is restorable. WAL retention follows (keeps WAL for every full).
repo1-retention-full=8
repo1-type=posix
process-max=2
log-level-console=info
log-level-file=info
start-fast=y

[global:archive-push]
compress-level=3

[shaka_db]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
pg1-user=shaka