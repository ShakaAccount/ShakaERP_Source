[global]
repo1-path=/var/lib/pgbackrest
repo1-retention-full=2
repo1-retention-archive-type=diff
repo1-retention-archive=7
repo1-type=posix
process-max=2
log-level-console=info
log-level-file=info
start-fast=y

[global:archive-push]
compress-level=3

[shaka_db]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
pg1-user=shaka