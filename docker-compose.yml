version: '3.8'

services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: odoo_19_db
    restart: unless-stopped
    env_file:
      - .env
    user: postgres
    command: >
      postgres
      -c wal_level=replica
      -c archive_mode=on
      -c "archive_command=pgbackrest --stanza=shaka_db archive-push %p"
      -c archive_timeout=900
      -c max_wal_senders=3
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      # Host folder for pgBackRest WALs and physical backups:
      - ./backups/pgbackrest:/var/lib/pgbackrest
    ports:
      - "5433:5432"
    networks:
      - odoo_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: odoo_19_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8069"
      - "8072"
    env_file:
      - .env
    volumes:
      - .:/opt/odoo:z
      - ./odoo.conf:/etc/odoo/odoo.conf:ro
      - odoo_data:/var/lib/odoo
      - odoo_web_data:/home/odoo/.local
    networks:
      - odoo_net
    command: ./odoo-bin -c /etc/odoo/odoo.conf --db_host=db -r ${POSTGRES_USER} -w ${POSTGRES_PASSWORD} -u all

  nginx:
    image: nginx:alpine
    container_name: odoo_19_nginx
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - odoo_net

  backup_runner:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: odoo_19_backup_runner
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - ./backup_local.sh:/usr/local/bin/backup_local.sh:ro
      - odoo_data:/var/lib/odoo:ro
      # Host folders for local access:
      - ./backups/pgbackrest:/var/lib/pgbackrest
      - ./backups/exports:/var/lib/local_backups
    networks:
      - odoo_net
    entrypoint: ["cron", "-f"]

volumes:
  pg_data:
    name: odoo_19_pg_data
  odoo_data:
    name: odoo_19_data
  odoo_web_data:
    name: odoo_19_web_data

networks:
  odoo_net:
    driver: bridge
