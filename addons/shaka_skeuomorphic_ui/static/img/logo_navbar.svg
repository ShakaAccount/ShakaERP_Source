<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="160" height="40">
  <defs>
    <!-- Leather texture -->
    <pattern id="leatherPatternSmall" patternUnits="userSpaceOnUse" width="50" height="50">
      <filter id="leatherNoiseSmall">
        <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="3" stitchTiles="stitch" result="noise"/>
        <feColorMatrix type="saturate" values="0"/>
      </filter>
      <rect width="50" height="50" fill="#8B6914" filter="url(#leatherNoiseSmall)"/>
    </pattern>
    
    <!-- Gold gradient -->
    <linearGradient id="goldGradientSmall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#DAA520"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    
    <!-- Green gradient -->
    <linearGradient id="greenGradientSmall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    
    <!-- Text gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#F5F0E1"/>
    </linearGradient>
    
    <!-- Drop shadow for text -->
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="offsetblur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Leaf icon -->
  <g transform="translate(20, 20)">
    <path d="M 0 -16 
             C 8 -22, 16 -18, 14 -8
             C 18 -2, 16 6, 0 12
             C -16 6, -18 -2, -14 -8
             C -16 -18, -8 -22, 0 -16 Z" 
          fill="url(#greenGradientSmall)"/>
    <path d="M 0 12 C 0 6, 0 -2, 0 -10" 
          stroke="#1B5E20" stroke-width="1.5" fill="none" opacity="0.6"/>
  </g>
  
  <!-- Text "ShakaERP" -->
  <text x="50" y="27" 
        font-family="Georgia, 'Times New Roman', serif" 
        font-size="22" 
        font-weight="600" 
        fill="url(#textGradient)" 
        filter="url(#textShadow)"
        letter-spacing="0.5">
    ShakaERP
  </text>
  
  <!-- Small brass accent line under text -->
  <line x1="50" y1="32" x2="140" y2="32" 
        stroke="url(#goldGradientSmall)" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
</svg>