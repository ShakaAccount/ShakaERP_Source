<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Leather texture pattern -->
    <pattern id="leatherPattern" patternUnits="userSpaceOnUse" width="100" height="100">
      <filter id="leatherNoise">
        <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="4" stitchTiles="stitch" result="noise"/>
        <feColorMatrix type="saturate" values="0"/>
        <feBlend mode="multiply" in="SourceGraphic" in2="noise"/>
      </filter>
      <rect width="100" height="100" fill="#8B6914" filter="url(#leatherNoise)"/>
    </pattern>
    
    <!-- Gold gradient for text -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="30%" stop-color="#DAA520"/>
      <stop offset="60%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    
    <!-- Green gradient for leaf -->
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="50%" stop-color="#2E7D32"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>
    
    <!-- Brass gradient for accents -->
    <linearGradient id="brassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#B5A642"/>
      <stop offset="100%" stop-color="#8B7D1A"/>
    </linearGradient>
    
    <!-- Drop shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="2" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="offsetblur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle with leather texture -->
  <circle cx="100" cy="100" r="95" fill="url(#leatherPattern)" filter="url(#dropShadow)"/>
  
  <!-- Inner brass ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#brassGradient)" stroke-width="3"/>
  
  <!-- Main leaf emblem -->
  <g transform="translate(100, 100)">
    <!-- Leaf shape -->
    <path d="M 0 -60 
             C 30 -80, 60 -70, 50 -30
             C 70 -10, 60 20, 0 40
             C -60 20, -70 -10, -50 -30
             C -60 -70, -30 -80, 0 -60 Z" 
          fill="url(#leafGradient)" 
          filter="url(#dropShadow)"/>
    
    <!-- Leaf vein -->
    <path d="M 0 40 C 0 20, 0 -10, 0 -40" 
          stroke="#1B5E20" stroke-width="2" fill="none" opacity="0.6"/>
    
    <!-- Secondary veins -->
    <path d="M -15 10 C -10 0, -5 -15, 0 -25" 
          stroke="#1B5E20" stroke-width="1.5" fill="none" opacity="0.4"/>
    <path d="M 15 10 C 10 0, 5 -15, 0 -25" 
          stroke="#1B5E20" stroke-width="1.5" fill="none" opacity="0.4"/>
  </g>
  
  <!-- Outer gold decorative ring -->
  <circle cx="100" cy="100" r="98" fill="none" stroke="url(#goldGradient)" stroke-width="1.5" opacity="0.8"/>
</svg>